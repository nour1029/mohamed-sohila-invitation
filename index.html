<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7EFDF">

<!-- TODO Phase 15: real title, description, OG image -->
<title>Wedding Invitation</title>
<meta name="description" content="You are invited.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Script font: Pinyon Script is the working default. All four candidates render
  side by side in _fonts.html — swap the pick here and in --font-script.
-->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Ovo&family=Pinyon+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<!-- Marks that scripting is available, before first paint. The reveal styles
     hang off this, so a failed script leaves content visible rather than
     stranding the whole invitation at opacity 0. -->
<script>document.documentElement.classList.add('js');</script>
</head>

<body>

<!-- ============================================================
     Phase 0 scaffold. Every <section> below is an empty labeled
     band; the phase that fills it is named in the badge.
     ============================================================ -->

<!-- 1 · Envelope gate — Phase 2. Outside <main>: it covers the page
     rather than being part of the document flow. -->
<div class="gate" id="gate">
  <div class="gate__envelope">

    <div class="gate__glow" aria-hidden="true"></div>

    <div class="gate__pocket gate__paper" aria-hidden="true"></div>

    <div class="gate__flap" aria-hidden="true">
      <span class="gate__flap-face gate__paper"></span>
    </div>

    <button class="gate__seal seal seal--monogram" type="button" id="gate-open">
      <span class="seal__mark" data-wedding="couple.monogram" aria-hidden="true"></span>
      <span class="visually-hidden">Open the invitation</span>
    </button>

  </div>

  <p class="gate__cue cue" aria-hidden="true">
    <span class="cue__chevron"></span>
    <span class="cue__label caps">Tap to open</span>
  </p>
</div>

<main id="invitation">


  <!-- 2 · Hero — Phase 3. tabindex allows the gate to land focus here. -->
  <section id="hero" class="hero" tabindex="-1">

    <!-- TODO Phase 14: swap in the lake / swans background -->
    <div class="hero__scene slot" aria-hidden="true">Lake &amp; swans<br>background</div>

    <!-- TODO Phase 14: swap in stone column + rose garland art -->
    <div class="hero__column hero__column--start slot" aria-hidden="true">Column</div>
    <div class="hero__column hero__column--end slot" aria-hidden="true">Column</div>

    <div class="hero__inner">
      <p class="hero__eyebrow caps" data-reveal>Wedding Day</p>
      <p class="hero__date display" data-reveal>
        <time data-wedding="date"></time>
      </p>

      <h1 class="heading heading--names hero__names" data-reveal>
        <span data-wedding="couple.one"></span>
        <span class="amp" aria-hidden="true">&amp;</span>
        <span data-wedding="couple.two"></span>
      </h1>
    </div>

    <!-- TODO Phase 14: swap in watercolour floral clusters -->
    <div class="hero__corner hero__corner--start slot" aria-hidden="true">Floral</div>
    <div class="hero__corner hero__corner--end slot" aria-hidden="true">Floral</div>

    <p class="hero__cue cue cue--down" aria-hidden="true">
      <span class="cue__chevron"></span>
      <span class="cue__label script">Scroll down</span>
    </p>

  </section>

  <!-- 3 · Bismillah / invitation — Phase 5 -->
  <section id="invitation-card" class="band" data-phase="Phase 5">
    <h2 class="band__label" data-reveal>Bismillah &amp; invitation</h2>
  </section>

  <!-- 4 · Countdown — Phase 6 -->
  <section id="countdown" class="band" data-phase="Phase 6">
    <h2 class="band__label" data-reveal>Countdown</h2>
  </section>

  <!-- 5 · Schedule — Phase 7 -->
  <section id="schedule" class="band" data-phase="Phase 7">
    <h2 class="band__label" data-reveal>Schedule of events</h2>
  </section>

  <!-- 6 · Venue + map — Phase 8 -->
  <section id="venue" class="band" data-phase="Phase 8">
    <h2 class="band__label" data-reveal>Location &amp; map</h2>
  </section>

  <!-- 7 · Dress code & gift — Phase 9 -->
  <section id="details" class="band" data-phase="Phase 9">
    <h2 class="band__label" data-reveal>Dress code &amp; gift</h2>
  </section>

  <!-- 8 · RSVP — Phase 10 -->
  <section id="rsvp" class="band" data-phase="Phase 10">
    <h2 class="band__label" data-reveal>RSVP</h2>
  </section>

  <!-- 9 · Closing — Phase 12 -->
  <section id="closing" class="band" data-phase="Phase 12">
    <h2 class="band__label" data-reveal>Closing</h2>
  </section>

</main>

<!-- Persistent music button — Phase 11 -->

<script src="js/main.js"></script>
</body>
</html>
